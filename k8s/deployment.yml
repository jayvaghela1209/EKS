kind: Deployment
apiVersion: apps/v1
metadata:
  name: react-app
  namespace: react-app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-con
          image: jayvaghela0304/ekscluster:v1
          ports:
            - containerPort: 7000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
